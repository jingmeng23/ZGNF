app:
  addresses:
    require-region-codes-at-checkout: false
  payments:
    callback-allowed-peers: 127.0.0.1,::1
    reconciliation-enabled: false
    allowed-channels: test
    callback-secret: test-only-payment-callback-secret-2026
  orders:
    close-release-enabled: false
    expiry-scan-enabled: false
    outbox-enabled: false
    compensation-enabled: false
  checkout:
    delivery:
      legacy-free-shipping-enabled: true
  encryption-key: test-only-phone-encryption-key-2026
  jwt:
    secret: test-only-secret-key-at-least-thirty-two-bytes-2026
spring:
  datasource:
    url: jdbc:h2:mem:gas_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false
