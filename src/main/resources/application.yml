server:
  port: 8080
spring:
  application:
    name: gas-ecommerce
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  flyway:
    enabled: true
    locations: classpath:db/migration
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.gas.ecommerce.modules.**.entity
  global-config:
    db-config:
      # Java property isDeleted maps to database column is_deleted.
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  structured:
    format:
      console: logstash
  level:
    com.gas.ecommerce: INFO
